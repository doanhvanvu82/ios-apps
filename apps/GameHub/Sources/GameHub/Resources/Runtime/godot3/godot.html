<!DOCTYPE html>
<html xmlns='http://www.w3.org/1999/xhtml' lang='' xml:lang=''>
<head>
	<meta charset='utf-8' />
	<meta name='viewport' content='width=device-width, user-scalable=no' />
	<link id='-gd-engine-icon' rel='icon' type='image/png' href='favicon.png' />
	<title>$GODOT_PROJECT_NAME</title>
	<style type='text/css'>

		body {
			touch-action: none;
			margin: 0;
			border: 0 none;
			padding: 0;
			text-align: center;
			background-color: black;
		}

		#canvas {
			display: block;
			margin: 0;
			color: white;
		}

		#canvas:focus {
			outline: none;
		}

		.godot {
			font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
			color: #e0e0e0;
			background-color: #3b3943;
			background-image: linear-gradient(to bottom, #403e48, #35333c);
			border: 1px solid #45434e;
			box-shadow: 0 0 1px 1px #2f2d35;
		}


		/* Status display
		 * ============== */

		#status {
			position: absolute;
			left: 0;
			top: 0;
			right: 0;
			bottom: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			/* don't consume click events - make children visible explicitly */
			visibility: hidden;
		}

		#status-progress {
			width: 366px;
			height: 7px;
			background-color: #38363A;
			border: 1px solid #444246;
			padding: 1px;
			box-shadow: 0 0 2px 1px #1B1C22;
			border-radius: 2px;
			visibility: visible;
		}

		@media only screen and (orientation:portrait) {
			#status-progress {
				width: 61.8%;
			}
		}

		#status-progress-inner {
			height: 100%;
			width: 0;
			box-sizing: border-box;
			transition: width 0.5s linear;
			background-color: #202020;
			border: 1px solid #222223;
			box-shadow: 0 0 1px 1px #27282E;
			border-radius: 3px;
		}

		#status-indeterminate {
			visibility: visible;
			position: relative;
		}

		#status-indeterminate > div {
			width: 4.5px;
			height: 0;
			border-style: solid;
			border-width: 9px 3px 0 3px;
			border-color: #2b2b2b transparent transparent transparent;
			transform-origin: center 21px;
			position: absolute;
		}

		#status-indeterminate > div:nth-child(1) { transform: rotate( 22.5deg); }
		#status-indeterminate > div:nth-child(2) { transform: rotate( 67.5deg); }
		#status-indeterminate > div:nth-child(3) { transform: rotate(112.5deg); }
		#status-indeterminate > div:nth-child(4) { transform: rotate(157.5deg); }
		#status-indeterminate > div:nth-child(5) { transform: rotate(202.5deg); }
		#status-indeterminate > div:nth-child(6) { transform: rotate(247.5deg); }
		#status-indeterminate > div:nth-child(7) { transform: rotate(292.5deg); }
		#status-indeterminate > div:nth-child(8) { transform: rotate(337.5deg); }

		#status-notice {
			margin: 0 100px;
			line-height: 1.3;
			visibility: visible;
			padding: 4px 6px;
			visibility: visible;
		}
	</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
	<canvas id='canvas'>
		HTML5 canvas appears to be unsupported in the current browser.<br />
		Please try updating or use a different browser.
	</canvas>
	<div id='status'>
		<div id='status-progress' style='display: none;' oncontextmenu='event.preventDefault();'><div id ='status-progress-inner'></div></div>
		<div id='status-indeterminate' style='display: none;' oncontextmenu='event.preventDefault();'>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
		</div>
		<div id='status-notice' class='godot' style='display: none;'></div>
	</div>

	<script type='text/javascript' src='gamehub_texture.js'></script>
	<script type='text/javascript' src='$GODOT_URL'></script>
	<script type='text/javascript'>//<![CDATA[

		const GODOT_CONFIG = $GODOT_CONFIG;
		var engine = new Engine(GODOT_CONFIG);

		(function() {
			const INDETERMINATE_STATUS_STEP_MS = 100;
			var statusProgress = document.getElementById('status-progress');
			var statusProgressInner = document.getElementById('status-progress-inner');
			var statusIndeterminate = document.getElementById('status-indeterminate');
			var statusNotice = document.getElementById('status-notice');

			var initializing = true;
			var statusMode = 'hidden';

			var animationCallbacks = [];
			function animate(time) {
				animationCallbacks.forEach(callback => callback(time));
				requestAnimationFrame(animate);
			}
			requestAnimationFrame(animate);

			function setStatusMode(mode) {

				if (statusMode === mode || !initializing)
					return;
				[statusProgress, statusIndeterminate, statusNotice].forEach(elem => {
					elem.style.display = 'none';
				});
				animationCallbacks = animationCallbacks.filter(function(value) {
					return (value != animateStatusIndeterminate);
				});
				switch (mode) {
					case 'progress':
						statusProgress.style.display = 'block';
						break;
					case 'indeterminate':
						statusIndeterminate.style.display = 'block';
						animationCallbacks.push(animateStatusIndeterminate);
						break;
					case 'notice':
						statusNotice.style.display = 'block';
						break;
					case 'hidden':
						break;
					default:
						throw new Error('Invalid status mode');
				}
				statusMode = mode;
			}

			function animateStatusIndeterminate(ms) {
				var i = Math.floor(ms / INDETERMINATE_STATUS_STEP_MS % 8);
				if (statusIndeterminate.children[i].style.borderTopColor == '') {
					Array.prototype.slice.call(statusIndeterminate.children).forEach(child => {
						child.style.borderTopColor = '';
					});
					statusIndeterminate.children[i].style.borderTopColor = '#dfdfdf';
				}
			}

			function setStatusNotice(text) {
				while (statusNotice.lastChild) {
					statusNotice.removeChild(statusNotice.lastChild);
				}
				var lines = text.split('\n');
				lines.forEach((line) => {
					statusNotice.appendChild(document.createTextNode(line));
					statusNotice.appendChild(document.createElement('br'));
				});
			};

			function displayFailureNotice(err) {
				var msg = err.message || err;
				console.error(msg);
				setStatusNotice(msg);
				setStatusMode('notice');
				initializing = false;
			};

			// Thay cho engine.startGame(): startGame tải pck vào 1 ArrayBuffer rồi
			// copyToFS chép thêm 1 bản (pck vài trăm MB → RAM x2, WebKit iOS giết
			// tiến trình). Ở đây stream thẳng vào buffer đúng kích thước rồi giao
			// cho MEMFS không chép (ownToFS trong godot.js).
			function loadPack(url, size, onProgress) {
				return fetch(url).then(function (response) {
					if (!response.ok) {
						throw new Error('Không tải được ' + url + ' (HTTP ' + response.status + ')');
					}
					const data = new Uint8Array(size);
					const reader = response.body.getReader();
					let loaded = 0;
					function pump() {
						return reader.read().then(function (part) {
							if (part.done) {
								if (loaded !== size) {
									throw new Error('Tải ' + url + ' thiếu: ' + loaded + '/' + size + ' byte');
								}
								return data;
							}
							data.set(part.value, loaded);
							loaded += part.value.length;
							onProgress(loaded, size);
							return pump();
						});
					}
					return pump();
				});
			}

			function startWithPack(onProgress) {
				const pack = GODOT_CONFIG['mainPack'];
				const packURL = pack.split('/').map(encodeURIComponent).join('/');
				return Promise.all([
					engine.init(GODOT_CONFIG['executable']),
					loadPack(packURL, GODOT_CONFIG['fileSizes'][pack], onProgress),
				]).then(function (results) {
					engine.rtenv['ownToFS'](pack, results[1]);
					// Godot 3 đọc override.cfg cạnh main pack:
					// - GLES2 (WebGL 1): GLES3/WebGL 2 của Godot 3 hay mất WebGL context
					//   trên WebKit iOS (màn đen), GLES2 là renderer Godot khuyên cho web.
					// - Game 2D không cần bóng đổ 3D, mặc định Godot vẫn cấp 2 texture
					//   độ sâu 4096² (~134 MB VRAM).
					engine.rtenv['ownToFS']('override.cfg', new TextEncoder().encode(
						'[rendering]\n' +
						'quality/driver/driver_name="GLES2"\n' +
						'quality/directional_shadow/size=256\n' +
						'quality/directional_shadow/size.mobile=256\n' +
						'quality/shadow_atlas/size=256\n' +
						'quality/shadow_atlas/size.mobile=256\n'));
					return engine.start({ 'args': ['--main-pack', pack].concat(GODOT_CONFIG['args']) });
				});
			}

			// Chẩn đoán màn đen: kích thước canvas + WebGL còn sống, vài lần đầu.
			function reportCanvas() {
				const canvas = document.getElementById('canvas');
				canvas.addEventListener('webglcontextlost', () => console.error('GameHub: WebGL context lost'));
				let n = 0;
				const timer = setInterval(() => {
					const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
					console.log('GameHub canvas ' + canvas.width + 'x' + canvas.height +
						' css ' + canvas.clientWidth + 'x' + canvas.clientHeight +
						' gl=' + (gl ? (gl.isContextLost() ? 'lost' : 'ok') : 'none') +
						' window ' + window.innerWidth + 'x' + window.innerHeight);
					if (n === 0) {
						const t = window.__gamehubTextureStats;
						console.log('GameHub texture: thu nhỏ ' + t.halved + ' texture, tiết kiệm ' + Math.round(t.savedBytes / 1e6) + ' MB VRAM, mất ' + t.ms + 'ms');
					}
					if (++n >= 3) clearInterval(timer);
				}, 3000);
			}

			if (!Engine.isWebGLAvailable()) {
				displayFailureNotice('WebGL not available');
			} else {
				setStatusMode('indeterminate');
				startWithPack(function (current, total) {
						if (total > 0) {
							statusProgressInner.style.width = current/total * 100 + '%';
							setStatusMode('progress');
							if (current === total) {
								// wait for progress bar animation
								setTimeout(() => {
									setStatusMode('indeterminate');
								}, 500);
							}
						} else {
							setStatusMode('indeterminate');
						}
				}).then(() => {
					setStatusMode('hidden');
					initializing = false;
					reportCanvas();
				}, displayFailureNotice);
			}
		})();
	//]]></script>
</body>
</html>
